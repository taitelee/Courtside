<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Courtside...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fallback {
            display: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .button {
            background: white;
            color: #667eea;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .button:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏀 Courtside</h1>
        <p>Opening the app...</p>
        <div class="spinner"></div>
        
        <div class="fallback" id="fallback">
            <h2>App Not Found</h2>
            <p>If the Courtside app didn't open automatically, please:</p>
            <ul style="text-align: left; display: inline-block;">
                <li>Make sure you have the Courtside app installed</li>
                <li>Try scanning the QR code again</li>
                <li>Or manually open the Courtside app</li>
            </ul>
            <a href="#" class="button" onclick="window.close()">Close</a>
        </div>
    </div>

    <script>
        // Get court ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const courtId = urlParams.get('court') || 'Demo Court';
        
        // Try to open the app
        const deepLink = `courtside://join?court=${courtId}`;
        window.location.href = deepLink;
        
        // Show fallback if app doesn't open within 3 seconds
        setTimeout(() => {
            document.getElementById('fallback').style.display = 'block';
        }, 3000);
        
        // Also try alternative methods
        setTimeout(() => {
            // Try opening in a new tab as fallback
            const newWindow = window.open(deepLink, '_blank');
            if (newWindow) {
                newWindow.close();
            }
        }, 1000);
    </script>
</body>
</html>
